syntax = "proto3";
package relos;

service RelosTable {
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  rpc DropTable(DropTableRequest) returns (DropTableResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
}

// ---------- Column / Schema types ----------

enum ColumnType {
  COLUMN_TYPE_UNSPECIFIED = 0;
  COLUMN_TYPE_INT64 = 1;
  COLUMN_TYPE_UTF8 = 2;
  COLUMN_TYPE_BYTES = 3;
  COLUMN_TYPE_BOOL = 4;
  COLUMN_TYPE_FLOAT64 = 5;
}

message Value {
  oneof kind {
    bool is_null = 1;
    int64 int64_value = 2;
    string string_value = 3;
    bytes bytes_value = 4;
    bool bool_value = 5;
    double float64_value = 6;
  }
}

message ColumnDef {
  string name = 1;
  ColumnType column_type = 2;
  bool nullable = 3;
}

message TableSchema {
  string name = 1;
  repeated ColumnDef columns = 2;
  repeated string primary_key = 3;
}

message Row {
  repeated Value values = 1;
}

// ---------- Request / Response messages ----------

message CreateTableRequest {
  TableSchema schema = 1;
}

message CreateTableResponse {}

message DropTableRequest {
  string table = 1;
}

message DropTableResponse {}

message PutRequest {
  string table = 1;
  Row row = 2;
}

message PutResponse {}

message DeleteRequest {
  string table = 1;
  repeated Value key = 2;
}

message DeleteResponse {}

message GetRequest {
  string table = 1;
  repeated Value key = 2;
}

message GetResponse {
  bool found = 1;
  Row row = 2;  // only set when found == true
}

message ScanRequest {
  string table = 1;
}

message ScanResponse {
  repeated Row rows = 1;
}
