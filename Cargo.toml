[workspace]
resolver = "2"
members = [
    "crates/relos-core",
    "crates/relos-store",
    "crates/relos-log",
    "crates/relos-engine",
    "crates/relos-table",
    "crates/relos-server",
    "crates/relos-client",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
